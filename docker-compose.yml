services:
  taa:
    build: ./taa
    container_name: alphawise-taa
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    env_file: ./taa/.env
    ports:
      - "127.0.0.1:8001:8000"

  faa:
    build: ./faa
    container_name: alphawise-faa
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
