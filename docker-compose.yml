      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    env_file: ./rag/.env
    volumes:
      - /opt/alphawise/commercial/alphawise-knowledge-base:/data:ro
    ports:
      - "127.0.0.1:8010:8000"

  frontend:
    build: ./frontend
    container_name: alphawise-frontend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    environment:
      REPORTS_DIR: /reports
    volumes:
      # Gun sonu raporlari - SALT OKUNUR (:ro). Dashboard bu dizini yalnizca
      # listeler ve .pdf indirir; hicbir kosulda yazamaz.
      - /opt/alphawise/reports:/reports:ro
    ports:
      - "127.0.0.1:3000:3000"

  openbb:
    build: ./openbb-service
    container_name: alphawise-openbb
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    env_file: ./openbb-service/.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8040:8000"

  qlib:
    build: ./qlib-service
    env_file: ./qlib-service/.env
    volumes:
      - ./qlib-service/csv_data_persistent:/app/csv_data
      - ./qlib-service/models_persistent:/app/models
      - ./qlib-service/qlib_bin_data_persistent:/app/qlib_bin_data
      - ./qlib-service/data_prep:/app/data_prep
    container_name: alphawise-qlib
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    mem_limit: 28g
    ports:
      - "127.0.0.1:8050:8000"

  finbert:
    build: ./finbert-service
    container_name: alphawise-finbert
