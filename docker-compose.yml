  searxng:
    image: searxng/searxng:latest
    container_name: alphawise-searxng
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--timeout=5", "http://localhost:8080/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    volumes:
      - ./searxng-data:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8110/
    ports:
      - "127.0.0.1:8110:8080"

